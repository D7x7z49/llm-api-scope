# .pre-commit-config.yaml
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg

repos:
  - repo: https://github.com/D7x7z49/fix-headers-hook
    rev: v0.2.0
    hooks:
      - id: fix-headers
        files: ^(apiscope|test|tests|scripts|docs)/
        exclude: ^tests/fixtures/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: pdm-lock-check
        name: Check pdm lock file consistency
        entry: pdm lock --check
        language: unsupported
        files: ^pyproject\.toml$|^pdm\.lock$
        pass_filenames: false

      - id: mypy
        name: Type check with mypy
        entry: pdm run mypy apiscope/ tests/
        language: unsupported
        files: ^(apiscope|tests)/.*\.py$|^pyproject\.toml$
        pass_filenames: false

      - id: usage-doc
        name: Generate docs/usage.txt
        entry: pdm run python scripts/ci/usage.py --write docs/usage.txt
        language: unsupported
        files: ^(apiscope/.*\.py|scripts/ci/usage\.py|docs/usage\.txt)$
        pass_filenames: false

      - id: layout
        name: Check the apiscope layout
        entry: bash -c "git ls-tree -r --name-only \"${PRE_COMMIT_TO_REF:-HEAD}\" apiscope | pdm run python scripts/ci/layout.py"
        language: unsupported
        files: ^(apiscope/.*|scripts/ci/layout\.py)$
        pass_filenames: false
        stages: [pre-push, manual]

      - id: tests-layout
        name: Check the tests layout
        entry: pdm run python scripts/ci/tests_layout.py
        language: unsupported
        files: ^(tests/.*|apiscope/.*|scripts/ci/tests_layout\.py)$
        pass_filenames: false

      - id: pytest
        name: Run the tests
        entry: pdm run pytest
        language: unsupported
        stages: [pre-push, manual]
        always_run: true
        pass_filenames: false

      - id: commitizen
        name: Check the commit message with commitizen
        entry: pdm run cz check --allow-abort --commit-msg-file
        language: unsupported
        stages: [commit-msg]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-api-scope"
version = "0.7.0"
description = "read and cache structured documents from remote for LLM agents"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "D7x7z49", email = "85430783+D7x7z49@users.noreply.github.com" },
]
keywords = ["agent-tool", "document-reader", "openapi", "specification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "typer>=0.26.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/D7x7z49/llm-api-scope"
Repository = "https://github.com/D7x7z49/llm-api-scope.git"
Issues = "https://github.com/D7x7z49/llm-api-scope/issues"

[project.scripts]
apiscope = "apiscope.main:app"

[dependency-groups]
dev = ["mypy>=2.1.0", "pre-commit>=4.5.1", "pytest>=9.0.3", "ruff>=0.15.15"]

# ==============================================================================
# setuptools
# ==============================================================================
types = [
    "types-pyyaml>=6.0.12.20260518",
]

[tool.setuptools.packages.find]
include = ["apiscope*"]

[tool.setuptools.package-data]
apiscope = ["**/*.yaml", "**/*.json"]

# ==============================================================================
# pdm configuration
# ==============================================================================

[tool.pdm]
distribution = true

# ==============================================================================
# mypy configuration
# ==============================================================================

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

# ==============================================================================
# python-semantic-release
# ==============================================================================

[tool.semantic_release]
assets = []
build_command_env = []
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
logging_use_named_masks = false
major_on_zero = true
allow_zero_version = true
repo_dir = "."
no_git_verify = false
tag_format = "v{version}"
add_partial_tags = false
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = []
mode = "update"
insertion_flag = "<!-- version list -->"
template_dir = "templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = true

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = false

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "style",
    "refactor",
    "test",
]
allowed_tags = [
    "feat",
    "fix",
    "perf",
    "build",
    "chore",
    "ci",
    "docs",
    "style",
    "refactor",
    "test",
]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false
insecure = false

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

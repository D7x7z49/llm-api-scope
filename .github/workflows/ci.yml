# .github/workflows/ci.yml

# CI — commit messages, lock, lint, format, usage, layout, types, tests, e2e
# runs on pull requests and on main pushes so a direct push is still checked
# every step is read-only: CI checks, it never edits files

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# cancel a superseded pull request run, but let a main run finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # static checks, run once: ruff and mypy already target 3.12,
  # so their result does not change with the interpreter
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
          cache: true

      - name: install dependencies
        run: pdm sync -d

      - name: check the commit messages
        if: github.event_name == 'pull_request'
        run: >-
          pdm run cz check --rev-range
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: check the pdm lock file
        run: pdm lock --check

      - name: lint with ruff
        run: pdm run ruff check --output-format=github

      - name: check format with ruff
        run: pdm run ruff format --check --diff

      - name: check the usage reference
        run: pdm run python scripts/ci/usage.py --check docs/usage.txt

      - name: check the apiscope layout
        run: git ls-tree -r --name-only HEAD apiscope | pdm run python scripts/ci/layout.py

      - name: check the tests layout
        run: pdm run python scripts/ci/tests_layout.py

      - name: type check with mypy
        run: pdm run mypy apiscope/ tests/

  # the test suite and the installed console script on every supported python
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: true

      - name: install dependencies
        run: pdm sync -d

      - name: run tests
        run: pdm run pytest

      - name: run the end to end tests
        run: make e2e
